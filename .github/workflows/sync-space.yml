name: Sync Space

# A Hugging Face Space is a git repository, and it expects app.py at its root
# while this repo keeps it under serving/space/. So the sync is a copy into a
# clone of the Space rather than a mirror push: contents are replaced, the
# Space's own history is kept.

on:
  push:
    branches: [main]
    paths:
      - 'serving/space/**'
      # The Space runs these too: app.py imports rag.src.retrieve and reads
      # shared/system_prompt.txt, so a change to either has to reach it.
      - 'rag/src/**'
      - 'rag/catalog/**'
      - 'shared/**'
      - '.github/workflows/sync-space.yml'
  workflow_dispatch:

env:
  SPACE: eneskaya96/coffee-order-voice-swap

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy serving/space into the Space and push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN secret is not set"; exit 1; }

          git clone "https://oauth:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" space
          # --delete so a file removed here is removed there; .git is the clone's
          # own, not ours to overwrite.
          rsync -a --delete --exclude '.git' serving/space/ space/
          # shared/ and rag/ are copied whole rather than file by file. Naming
          # the files individually is how the Space broke once already: a new
          # shared/tool_call.py was imported by orders.py and never reached the
          # container, because the copy line still listed only the two it knew
          # about. A directory cannot fall behind that way.
          #
          # They are copied rather than duplicated inside serving/space so the
          # Space and the repo are never two versions of the same prompt, the
          # same schema, or the same catalog.
          rsync -a --delete --exclude '__pycache__' shared/ space/shared/
          rsync -a --delete --exclude '__pycache__' --exclude 'tests' \
                --exclude 'index' rag/ space/rag/

          cd space
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Space already matches serving/space -- nothing to push."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
