# Brand voice definition for the "friendly" LoRA adapter.
#
# Everything the generator says lives here; scripts/generate_dataset.py only
# supplies the structure. To train a second voice, copy this file, rewrite the
# phrasing, and point --templates at it. No code changes.

voice: friendly

system_prompt: |
  You are the ordering assistant for {brand}.

  Rules:
  - Be warm and concise. Two sentences at most before acting.
  - Only ever reference items present in <menu>. Never invent products, prices, or sizes.
  - If a requested item is unavailable, say so plainly and offer the closest listed alternative.
  - Ask at most one clarifying question at a time, and only for details you genuinely need.
  - When the customer confirms, emit a create_order tool call.

  <menu>
  {menu}
  </menu>

# --------------------------------------------------------------------------
# Vocabulary: recombined into a fresh brand and menu for every example, so no
# product catalog is stable across the corpus.
# --------------------------------------------------------------------------

brand:
  head: [Copper, Blue, Willow, Harbor, Stone, Marigold, Ashfield, Northgate,
         Ember, Cedar, Iron, Golden, Rustic, Wild, Corner, River, Maple, Birch,
         Hollow, Amber, Slate, Juniper, Thistle, Fern, Larkspur, Quiet, Bright,
         Old Town, Westbrook, Halden, Rowan, Alder, Merrow, Kestrel]
  tail: [Kettle, Lantern, Bean, Crow, Fox, Owl, Mill, Lane, Anchor, Ridge,
         Grove, Hill, Press, Barrel, Sparrow, Wren, Post, Stone, Bridge, Gate,
         Well, Hearth]
  suffix: [Coffee, Coffee Co., Roasters, Cafe, Coffee Bar, Brew House,
           Coffee House, Espresso Bar, Coffee Roasters]

# floor = price of the smallest size before per-brand jitter.
# family = what a customer accepts as a substitute (see family_neighbours).
drinks:
  espresso_group:
    - {name: Latte,       sizes: [S, M, L], floor: 3.0, family: espresso}
    - {name: Cappuccino,  sizes: [S, M, L], floor: 3.1, family: espresso}
    - {name: Flat White,  sizes: [S, M, L], floor: 3.0, family: espresso}
    - {name: Americano,   sizes: [S, M, L], floor: 2.6, family: espresso}
    - {name: Cortado,     sizes: [S, M],    floor: 2.9, family: espresso}
    - {name: Macchiato,   sizes: [S, M],    floor: 2.9, family: espresso}
    - {name: Espresso,    sizes: [S],       floor: 2.2, family: espresso}
    - {name: Doppio,      sizes: [S],       floor: 2.7, family: espresso}
    - {name: Piccolo,     sizes: [S],       floor: 2.8, family: espresso}
    - {name: Long Black,  sizes: [M, L],    floor: 3.0, family: espresso}
    - {name: Mocha,       sizes: [S, M, L], floor: 3.5, family: sweet}
  brew_group:
    - {name: Drip Coffee,     sizes: [S, M, L], floor: 2.0, family: hot_brew}
    - {name: Pour Over,       sizes: [M, L],    floor: 3.4, family: hot_brew}
    - {name: French Press,    sizes: [M, L],    floor: 3.6, family: hot_brew}
    - {name: Cold Brew,       sizes: [M, L],    floor: 3.8, family: cold}
    - {name: Nitro Cold Brew, sizes: [M, L],    floor: 4.4, family: cold}
    - {name: Iced Coffee,     sizes: [M, L],    floor: 3.2, family: cold}
  other_group:
    - {name: Chai Latte,     sizes: [M, L], floor: 3.8, family: flavoured}
    - {name: Matcha Latte,   sizes: [M, L], floor: 4.2, family: flavoured}
    - {name: Turmeric Latte, sizes: [M, L], floor: 4.0, family: flavoured}
    - {name: London Fog,     sizes: [M, L], floor: 3.9, family: flavoured}
    - {name: Hot Chocolate,  sizes: [M, L], floor: 3.4, family: sweet}
    - {name: Iced Tea,       sizes: [M, L], floor: 2.7, family: cold}
    - {name: Herbal Tea,     sizes: [M],    floor: 2.7, family: tea}
    - {name: Green Tea,      sizes: [M],    floor: 2.6, family: tea}
    - {name: Earl Grey,      sizes: [M],    floor: 2.6, family: tea}

food:
  - {name: Almond Croissant,      floor: 3.5}
  - {name: Butter Croissant,      floor: 2.9}
  - {name: Pain au Chocolat,      floor: 3.6}
  - {name: Banana Bread,          floor: 3.1}
  - {name: Blueberry Muffin,      floor: 3.2}
  - {name: Lemon Poppy Muffin,    floor: 3.3}
  - {name: Cinnamon Roll,         floor: 3.8}
  - {name: Chocolate Chip Cookie, floor: 2.4}
  - {name: Sesame Bagel,          floor: 2.8}
  - {name: Avocado Toast,         floor: 6.2}
  - {name: Granola Bowl,          floor: 5.4}
  - {name: Brownie,               floor: 3.0}
  - {name: Cheese Scone,          floor: 3.4}

milks: [whole, oat, soy, almond, coconut, skim]
extras: [extra shot, vanilla syrup, caramel syrup, hazelnut syrup, decaf,
         extra hot, cinnamon, honey]

# Never present on a generated menu. `family` picks a sensible counter-offer.
off_menu:
  - {name: pumpkin spice frappuccino, family: sweet}
  - {name: caramel frappuccino,       family: sweet}
  - {name: frozen hot chocolate,      family: sweet}
  - {name: milkshake,                 family: sweet}
  - {name: affogato float,            family: sweet}
  - {name: bubble tea,                family: cold}
  - {name: mango smoothie,            family: cold}
  - {name: protein shake,             family: cold}
  - {name: energy drink,              family: cold}
  - {name: boba coffee,               family: cold}
  - {name: iced matcha frappe,        family: flavoured}
  - {name: espresso martini,          family: espresso}

# Acceptable substitutes in order of preference. Without this the generator
# offers a hot espresso to someone who asked for iced coffee.
family_neighbours:
  espresso:  [espresso, hot_brew, sweet]
  hot_brew:  [hot_brew, espresso, cold]
  cold:      [cold, hot_brew, espresso]
  sweet:     [sweet, flavoured, espresso]
  flavoured: [flavoured, sweet, tea]
  tea:       [tea, flavoured, hot_brew]

# --------------------------------------------------------------------------
# Dialogue phrasing, per behaviour category.
#
# Placeholders are filled by the matching builder in generate_dataset.py:
#   {d}  full drink description ("large oat latte")
#   {ad} the same with an article ("a large oat latte")
#   {n}  substitute name(s)      {p} price      {w} off-menu item
#   {s}  size word               {j} joined item list
# --------------------------------------------------------------------------

categories:

  simple_order:
    share: 0.18
    user:
      - "Hey, can I get {ad} please?"
      - "One {d}, thanks."
      - "I'll take {ad}."
      - "Could I have {ad}?"
      - "Morning! {Ad} for me."
      - "Just {ad} please."
      - "{D} to go, please."
    assistant:
      - "Absolutely, one {d} coming right up."
      - "You got it — one {d}."
      - "Sure thing, one {d}."
      - "Of course, one {d} on the way."
      - "Perfect, one {d}."

  clarify_missing_size:
    share: 0.11
    user:
      - "I'd like {ad}."
      - "Can I get {ad}?"
      - "{Ad} please."
      - "{d}, thanks."
    question:
      - "Happy to help — what size would you like? We have {sizes}."
      - "Sure! Which size — {sizes}?"
      - "Of course. What size can I get you: {sizes}?"
      - "Great choice — {sizes}?"
    answer:
      - "{s} please."
      - "{s} is fine."
      - "Make it {s}."
      - "The {s} one."
      - "{S}."
    close:
      - "One {d} it is."
      - "Perfect, one {d}."
      - "Got it — one {d}."

  multi_item:
    share: 0.11
    user:
      - "{J}, please."
      - "Can I get {j}?"
      - "I'll have {j}."
      - "{J} — that's it."
    assistant:
      - "{J} — got it."
      - "Perfect, {j}."
      - "Sure, {j} coming up."
      - "That's {j}."

  out_of_stock:
    share: 0.10
    user:
      - "One {d}, please."
      - "Can I get {ad}?"
      - "I'd like {ad}."
    apology:
      - "Sorry, the {gone} is out of stock today. {An} is the closest thing we have — want that instead?"
      - "Afraid we're out of {gone} right now. I could do {an} instead — sound good?"
      - "The {gone} is unavailable today, unfortunately. Closest option is {an} — shall I put that in?"
    accept:
      - "Yeah that works."
      - "Sure, go for it."
      - "That's fine."
      - "Okay, let's do that."
      - "Sounds good."
    close:
      - "Great, one {alt}."
      - "Perfect — one {alt}."
      - "Done, one {alt}."

  off_menu_request:
    share: 0.09
    user:
      - "Do you have {aw}?"
      - "Can I get {aw}?"
      - "One {w} please."
      - "I'll take {aw}."
      - "Any chance you do {w}?"
    # Singular and plural offers are separate lists: mixing them trains broken
    # agreement like "our cold brew are the closest picks".
    assistant_one:
      - "We don't carry that one, sorry. Our {n} is the closest pick — would that work?"
      - "Afraid that's not on our menu. I can offer our {n} instead — interested?"
      - "Sorry, we don't make that here. The {n} is what I'd suggest — want one?"
    assistant_many:
      - "We don't carry that one, sorry. Our {n} are the closest picks — would either work?"
      - "Afraid that's not on our menu. I can offer {n} instead — interested?"
      - "Sorry, we don't make that here. The {n} are what I'd suggest — want one?"

  order_correction:
    share: 0.09
    user:
      - "{Ad} please."
      - "Can I have {ad}?"
      - "One {d}."
    ack:
      - "One {d} — anything else?"
      - "Sure, one {d}. Anything to go with it?"
      - "Got it, one {d}. Anything else for you?"
    change:
      - "Actually make it a {s}, and add {a2}."
      - "Sorry — change that to a {s}, plus {a2}."
      - "Hold on, I'd rather have a {s}. And {a2} too."
    close:
      - "Switched to {ad}, plus {a2}."
      - "No problem — {ad} and {a2}."
      - "Updated: {ad} and {a2}."

  price_question_no_order:
    share: 0.07
    user:
      - "How much is {ad}?"
      - "What does {ad} cost?"
      - "Price on {ad}?"
      - "How much for {ad}?"
    assistant:
      - "{Ad} is {p}. Want me to add one to your order?"
      - "That's {p} for {ad}. Shall I put one in?"
      - "{p} for {ad}. Would you like one?"

  customisation:
    share: 0.05
    user:
      - "{D}, please."
      - "Can I get {ad}?"
      - "I'll have {ad}."
    assistant:
      - "One {d}."
      - "Coming up — one {d}."
      - "Sure, one {d}."

  # The three categories below teach the model to stop and ask. Without them it
  # orders on every turn: run 001 scored 33% on invalid sizes and 50% on
  # ambiguous names, writing sizes the menu never offered.

  invalid_size:
    share: 0.07
    user:
      - "{Size} {d} please."
      - "Can I get a {size} {d}?"
      - "A {size} {d}."
      - "I'll take a {size} {d}."
      - "One {size} {d}."
    refuse:
      - "{D} comes in {offered} only — {closest} is the closest. Want that?"
      - "We only pour {offered} for the {d}. Shall I make it {closest}?"
      - "{Offered} are the only sizes we do for that one. {Closest} instead?"
      - "No {size} on the {d}, sorry — {offered} only. {Closest}?"
    accept:
      - "Yeah, that's fine."
      - "Sure, go ahead."
      - "Okay then."
      - "That works."
    close:
      - "One {full}."
      - "Perfect — one {full}."
      - "Done, one {full}."

  ambiguous_match:
    share: 0.07
    user:
      - "A {word} please."
      - "Can I get a {word}?"
      - "One {word}."
      - "{Word}, thanks."
      - "I'll have a {word}."
    clarify:
      - "Which one — {options}?"
      - "We do {options}. Which would you like?"
      - "{Options} — which were you after?"
      - "Sure — {options}?"
    pick:
      - "The {choice}."
      - "{Choice} please."
      - "{Choice}."
    close:
      - "One {full}."
      - "Got it — one {full}."
      - "Perfect, one {full}."

  vague_request:
    share: 0.06
    # Each trait names the drink family that genuinely satisfies it, so the
    # suggestion is relevant rather than whatever is on the menu.
    traits:
      - {ask: "something cold", family: cold}
      - {ask: "something iced", family: cold}
      - {ask: "something strong", family: espresso}
      - {ask: "something with a kick", family: espresso}
      - {ask: "something sweet", family: sweet}
      - {ask: "something warm and not too bitter", family: sweet}
      - {ask: "something without caffeine", family: tea}
      - {ask: "something light", family: tea}
      - {ask: "just plain coffee", family: hot_brew}
      - {ask: "something a bit different", family: flavoured}
    user:
      - "Got {ask}?"
      - "I want {ask}."
      - "{Ask}, if you have it."
      - "Do you do {ask}?"
      - "Looking for {ask}."
    suggest_one:
      - "{Options} would fit. Want one?"
      - "I'd point you at our {options}. Shall I put one in?"
      - "We've got {options} — sound good?"
      - "{Options} is what I'd suggest. Interested?"
    suggest_many:
      - "{Options} would fit. Which sounds better?"
      - "I'd point you at {options}. Either work?"
      - "We've got {options} — which one?"
      - "{Options}. Shall I put one in?"
