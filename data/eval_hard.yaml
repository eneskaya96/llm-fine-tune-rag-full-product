# Hand-written hard eval set.
#
# Nothing here comes from generate_dataset.py. Every phrasing, menu, and
# difficulty is written by hand, deliberately outside the shapes the training
# templates produce, so the score measures generalisation rather than template
# recall.
#
# `expects_order: false` marks the cases where a correct assistant emits no
# tool call -- it asks, refuses, or answers instead.
#
# Compiled to data/eval_hard.jsonl by scripts/build_eval_hard.py.

